<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#b8542f"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top lintel upward curved beam -->
    <path d="M 94 104 Q 256 116 418 104" stroke="#fffdfa" stroke-width="8.5"/>
    
    <!-- Top accent gold bar -->
    <line x1="168" y1="120" x2="344" y2="120" stroke="#d49239" stroke-width="6"/>
    
    <!-- Top horizontal white bar -->
    <line x1="116" y1="134" x2="396" y2="134" stroke="#fffdfa" stroke-width="8"/>
    
    <!-- Outermost soundwave bars (short, salmon-peach) -->
    <line x1="88" y1="232" x2="88" y2="296" stroke="#f0b8a6" stroke-width="13"/>
    <line x1="424" y1="232" x2="424" y2="296" stroke="#f0b8a6" stroke-width="13"/>
    
    <!-- Inner soundwave bars (medium, salmon-peach) -->
    <line x1="144" y1="172" x2="144" y2="356" stroke="#f0b8a6" stroke-width="13"/>
    <line x1="368" y1="172" x2="368" y2="356" stroke="#f0b8a6" stroke-width="13"/>
    
    <!-- White pillars (from top bar to bottom bar) -->
    <line x1="202" y1="138" x2="202" y2="390" stroke="#fffdfa" stroke-width="18" stroke-linecap="butt"/>
    <line x1="310" y1="138" x2="310" y2="390" stroke="#fffdfa" stroke-width="18" stroke-linecap="butt"/>
    
    <!-- Center vertical gold line -->
    <line x1="256" y1="138" x2="256" y2="390" stroke="#d49239" stroke-width="7" stroke-linecap="butt"/>
    
    <!-- Bottom horizontal white bar -->
    <line x1="116" y1="394" x2="396" y2="394" stroke="#fffdfa" stroke-width="8"/>
    
    <!-- Bottom curved white arc -->
    <path d="M 116 404 Q 256 418 396 404" stroke="#fffdfa" stroke-width="8"/>
  </g>
  <!-- Bottom gold dot -->
  <circle cx="256" cy="436" r="5.5" fill="#d49239"/>
</svg>
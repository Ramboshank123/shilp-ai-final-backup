<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SHILP — From Craft to Customer</title>
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Stores current path and redirects to index.html with query param
      var pathSegmentsToKeep = 1;
      var l = window.location;
      // If we are on ramboshank123.github.io/shilp-ai-final-backup/...
      if (l.hostname.indexOf('github.io') !== -1) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      } else {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting to SHILP...</p>
  </body>
</html>
